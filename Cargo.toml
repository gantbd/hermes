[package]
name = "hermes-ledger"
version = "0.0.1"
edition = "2024"
rust-version = "1.95"
description = "A bounded durable event ledger with explicit consumer progress"
license = "MIT OR Apache-2.0"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]

[workspace]
members = [
  ".",
  "host/hermes-host",
  "adapters/hermes-local",
  "adapters/hermes-unix-peer",
  "adapters/hermes-aegis",
  "applications/hermes-daemon",
  "crates/hermes-client",
  "crates/hermes-consumer-command",
  "crates/hermes-conformance",
  "crates/hermes-disclosure-command",
  "crates/hermes-local-client",
  "crates/hermes-local-daemon",
  "crates/hermes-operator-command",
  "crates/hermes-protocol",
  "crates/hermes-service",
  "crates/hermes-wire",
  "sdk/embedded",
]
resolver = "3"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"

