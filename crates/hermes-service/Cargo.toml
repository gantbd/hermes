[package]
name = "hermes-service"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
description = "Authenticated service boundary for the Hermes ledger"
publish = false

[dependencies]
hermes-host = { path = "../../host/hermes-host", version = "=0.0.1" }
hermes-ledger = { path = "../..", version = "=0.0.1" }
hermes-protocol = { path = "../hermes-protocol", version = "=0.1.0" }
keystone-storage = { path = "../../../keystone/crates/keystone-storage", version = "=0.0.1" }

[dev-dependencies]
hermes-client = { path = "../hermes-client", version = "=0.1.0" }
hermes-conformance = { path = "../hermes-conformance", version = "=0.1.0" }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
