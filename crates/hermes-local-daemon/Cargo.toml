[package]
name = "hermes-local-daemon"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
description = "Private bounded Unix daemon for Hermes"
publish = false

[dependencies]
hermes-protocol = { path = "../hermes-protocol", version = "=0.1.0" }
hermes-service = { path = "../hermes-service", version = "=0.1.0" }
hermes-wire = { path = "../hermes-wire", version = "=0.1.0" }
keystone-framing = { path = "../../../keystone/crates/keystone-framing", version = "=0.0.1" }
keystone-storage = { path = "../../../keystone/crates/keystone-storage", version = "=0.0.1" }
keystone-unix-listener = { path = "../../../keystone/crates/keystone-unix-listener", version = "=0.0.1" }

[dev-dependencies]
hermes-ledger = { path = "../..", version = "=0.0.1" }
hermes-local = { path = "../../adapters/hermes-local", version = "=0.0.1" }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
