[package]
name = "hermes-aegis"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
description = "Public-client Aegis authorization adapter for Hermes"
publish = false

[dependencies]
aegis-client = { path = "../../../aegis/crates/aegis-client" }
aegis-protocol = { path = "../../../aegis/crates/aegis-protocol" }
hermes-protocol = { path = "../../crates/hermes-protocol", version = "=0.1.0" }
hermes-service = { path = "../../crates/hermes-service", version = "=0.1.0" }

[dev-dependencies]
aegis-authority = { path = "../../../aegis" }
aegis-host = { path = "../../../aegis/host/aegis-host" }
aegis-service = { path = "../../../aegis/crates/aegis-service" }
hermes-host = { path = "../../host/hermes-host", version = "=0.0.1" }
hermes-ledger = { path = "../..", version = "=0.0.1" }
keystone-storage = { path = "../../../keystone/crates/keystone-storage" }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
