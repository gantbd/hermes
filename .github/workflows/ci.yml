name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Check out Hermes
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: hermes
      - name: Check out Keystone dependency
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: gantbd/keystone
          path: keystone
      - name: Check out Aegis dependency
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: gantbd/aegis
          path: aegis
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal --component clippy,rustfmt
      - name: Audit current RustSec advisories
        working-directory: hermes
        run: |
          cargo install cargo-audit --version 0.23.0 --locked
          cargo audit --deny warnings
      - name: Verify workspace
        working-directory: hermes
        run: make check
      - name: Verify peer process profiles
        working-directory: hermes
        run: make check-peer-profiles

